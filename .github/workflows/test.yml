name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  visits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test_visits.mjs
      - run: node tools/test_search.mjs
